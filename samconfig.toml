# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "cavetools-notification-service"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

[prod.deploy.parameters]
stack_name = "cavetools-notification-service"
resolve_s3 = true
s3_prefix = "cavetools-notification-service"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = "EmailFromAddress=\"no-reply@cavetools.co.za\" AppConfigJson=\"{\\\"cavetools\\\":{\\\"displayName\\\":\\\"CaveTools\\\",\\\"ownerEmail\\\":\\\"hello@cavetools.co.za\\\"},\\\"topselect\\\":{\\\"displayName\\\":\\\"TopSelect\\\",\\\"ownerEmail\\\":\\\"bookings@topselect.co.za\\\"},\\\"wellmed\\\":{\\\"displayName\\\":\\\"WellMed\\\",\\\"ownerEmail\\\":\\\"admin@wellmed.co.za\\\"},\\\"madlite\\\":{\\\"displayName\\\":\\\"Madlite\\\",\\\"ownerEmail\\\":\\\"hello@madlite.co.za\\\"},\\\"lifestyleclub\\\":{\\\"displayName\\\":\\\"LifestyleClub\\\",\\\"ownerEmail\\\":\\\"Info@lifestyleclub.co.za\\\"}}\""
image_repositories = []

[prod.global.parameters]
region = "eu-west-1"
